name: Offline demo and application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen --python 3.12
      - run: uv run python -m patchpulse build-demo
      - run: uv run ruff check src tests && uv run ruff format --check src tests
      - run: uv run pytest -q
      - run: npm ci && npm run build && npm audit --audit-level=high
        working-directory: web
      - run: uv run python -m pip_audit --local
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: |
          uv run python -m patchpulse serve > /tmp/patchpulse.log 2>&1 &
          for i in $(seq 1 30); do curl --fail http://127.0.0.1:8000/health && break || sleep 1; done
          npm test --prefix web
      - run: uv run python scripts/check_public_files.py
